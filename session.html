<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Test Page</title>

  <!-- Open Graph — Telegram 预览爬虫优先读取 og:image，会直接请求该 URL -->
  <meta property="og:title"       content="Security Test">
  <meta property="og:description" content="Telegram link preview probe">
  <meta property="og:image"       content="https://webhook.site/e9e844db-3b29-4be9-95cd-1da788c74d7d/pixel.png">
  <meta property="og:image:width"  content="1">
  <meta property="og:image:height" content="1">
  <meta property="og:type"        content="website">

  <!-- Twitter Card（部分客户端回落读取） -->
  <meta name="twitter:card"  content="summary_large_image">
  <meta name="twitter:image" content="https://webhook.site/e9e844db-3b29-4be9-95cd-1da788c74d7d/pixel.png">
</head>
<body>
  <h1>Security Test Page</h1>
  <p>Testing Telegram link preview crawler IP behavior.</p>

  <!--
    双重触发：
    1. og:image — 爬虫解析 HTML 时读取并请求图片
    2. img 标签 — 浏览器渲染时也会发起请求（对比两次 IP）
  -->
  <img
    src="https://webhook.site/e9e844db-3b29-4be9-95cd-1da788c74d7d/pixel.png"
    width="1"
    height="1"
    alt=""
    style="position:absolute;opacity:0;"
  >
</body>
</html>
